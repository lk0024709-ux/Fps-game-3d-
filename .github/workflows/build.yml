name: Build Debug APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle and Android files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew android:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report build failure
        if: failure()
        run: |
          {
            echo '### Gradle failure'
            echo '```'
            tail -n 200 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface the key lines as annotations (readable through the checks API).
          grep -nE "FAILURE:|What went wrong|^Caused by|error:|Could not |Execution failed" /tmp/build.log \
            | head -n 8 \
            | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brfps-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
